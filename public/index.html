<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Panel - Virtual Classroom</title>
  <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb); color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
/* ===========================
   Welcome Screen
=========================== */

.welcome-container{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    z-index:999999;
    transition:.4s ease;
}

.welcome-container.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.welcome-card{
    width:90%;
    max-width:480px;
    padding:45px 35px;
    text-align:center;
    border-radius:20px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 20px 45px rgba(0,0,0,.4);
    color:#fff;
    animation:cardPop .5s ease;
}

.welcome-icon{
    font-size:60px;
    margin-bottom:15px;
}

.welcome-card h1{
    margin:0;
    font-size:22px;
    font-weight:400;
}

.welcome-card h2{
    margin:10px 0;
    font-size:34px;
    color:#fff;
    font-weight:700;
}

.welcome-card p{
    color:#dbeafe;
    margin:20px 0 30px;
    line-height:1.6;
}

.controls{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.controls input{
    padding:15px;
    border:none;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

.controls button{
    padding:15px;
    border:none;
    border-radius:12px;
    background:#22c55e;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.controls button:hover{
    background:#16a34a;
    transform:translateY(-2px);
}

@keyframes cardPop{
    from{
        opacity:0;
        transform:translateY(30px) scale(.95);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}
        
        .meeting-container { display: flex; flex: 1; height: calc(100vh - 140px); overflow: hidden; position: relative; }
        .sidebar { width: 15%; background: #161719; border-right: 1px solid #2a2d32; display: flex; flex-direction: column; gap: 5px; padding: 5px; transition: all 0.3s ease; }
        
        /* স্টুডেন্ট জয়েন করার পর সাইডবার হাইড করে ভিডিও ফুলস্ক্রিন করা */
        .meeting-container.joined .sidebar { display: none; }
        .meeting-container.joined .main-display { position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 0; }
        .meeting-container.joined .main-display video#teacherVideo { border-radius: 0; }

        /* শিক্ষার্থীর সার্কেল ভিডিও যা শিক্ষকের ভিডিওর উপরে বামে থাকবে */
        .my-video-card { 
            width: 100%; 
            background: #222; 
            border-radius: 8px; 
            border: 2px solid #3e424b; 
            overflow: hidden; 
            position: relative; 
            transition: all 0.3s ease;
        }
        .my-video-card video { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 4/3; transform: scaleX(-1); }
        .label { position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.6); padding: 2px 6px; font-size: 11px; border-radius: 4px; }

        /* জয়েন করার পর শিক্ষার্থীর ভিডিও সার্কেল স্টাইলে প্লেস করার জন্য CSS */
        .meeting-container.joined .my-video-card {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            z-index: 9999;
            border: 3px solid #007fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .meeting-container.joined .my-video-card .label { display: none; }

       .main-display { 
    flex: 1; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    background: #0e0f11; 
    padding: 2px; 
    position: relative; 
    overflow: hidden; 
}

.main-display video { 
    width: 100%; 
    height: 100%; 
    object-fit: fill; /* Stretches video to fill exact container dimensions */
    background: #000; 
    border-radius: 12px; 
}

        /* চ্যাট প্যানেলটি ভিডিওর ওপর ফ্লোটিং বা ওভারলে উইন্ডো হিসেবে থাকবে */
       /* চ্যাট প্যানেল ডিফোল্ট অবস্থায় হাইড থাকবে */
        .chat-panel { 
            position: absolute !important;
            right: 20px !important;
            bottom: 70px !important;
            top: auto !important;
            left: auto !important;
            width: 0;
            height: 0;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            background: rgba(22, 23, 25, 0.95) !important;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
            display: flex; 
            flex-direction: column; 
            transition: all 0.3s ease; 
            z-index: 99999 !important; 
        }

        /* টিচার ওপেন করলে ওভারলে ভাসমান উইন্ডো হিসেবে দৃশ্যমান হবে */
        .chat-panel.open { 
            width: 320px !important; 
            height: 400px !important;
            max-height: 70vh !important;
            opacity: 1 !important;
            visibility: visible !important;
            pointer-events: auto !important;
        }
        .role-label { position: absolute; top: 35px; left: 45px; background: #e02424; padding: 5px 12px; font-weight: bold; border-radius: 6px; }
        
        .action-bar { height: 70px; background: #1a1c20; display: flex; justify-content: center; align-items: center; border-top: 1px solid #2a2d32; gap: 15px; }
        
        /* Raise Hand বাটন ডিফোল্ট ও জয়েন করার পর শিক্ষকের ডান কোণে দেখানোর স্টাইল */
        .raise-btn { padding: 12px 30px; font-size: 15px; font-weight: bold; border: none; border-radius: 30px; background: #ff9800; color: black; cursor: pointer; display: none; }
        
        .meeting-container.joined .raise-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #statusLabel { font-size: 14px; padding: 10px 20px; border-radius: 20px; font-weight: bold; display: none; }
        .meeting-container.joined #statusLabel {
            position: absolute;
            top: 70px;
            right: 20px;
            z-index: 9999;
        }

        .status-muted { background: #ea4335; color: white; }
        .status-live { background: #2ea44f; color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 50% { opacity: 0.7; } }
    
        .chat-header { padding: 15px; background: #1a1c20; font-weight: bold; text-align: center; border-bottom: 1px solid #2a2d32; color: #4caf50; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg-block { padding: 8px 12px; border-radius: 6px; max-width: 85%; font-size: 13px; line-height: 1.4; word-break: break-all; }
        .msg-me { background: #007fff; color: #fff; align-self: flex-end; }
        .msg-other { background: #2a2d32; color: #fff; align-self: flex-start; }
        .chat-input-area { padding: 10px; background: #1a1c20; border-top: 1px solid #2a2d32; display: flex; flex-direction: column; gap: 8px; }
        .chat-row { display: flex; gap: 5px; }
        .chat-input-area input[type="text"] { flex: 1; padding: 8px; background: #222; border: 1px solid #3a3f47; border-radius: 4px; color: #fff; outline: none; }
        .chat-input-area button { padding: 8px 15px; background: #2ea44f; border: none; color: #fff; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .file-label { display: inline-block; background: #444; text-align: center; padding: 5px; font-size: 11px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .file-link { color: #ff9800; text-decoration: underline; display: block; font-weight: bold; margin-top: 4px; }
#raiseHandBtn, #myVideoCard {
    pointer-events: auto;
    z-index: 100; /* ভিডিওর ওপরে বাটন রাখার জন্য */
}

    </style>
</head>
<body>

     <div class="welcome-container">
                    <div class="welcome-card">
                        <div class="welcome-icon">🎓</div>

                        <h1>Welcome to</h1>
                        <h2>Lachit Global Studies</h2>

                        <p>
                            Join your live class and start learning with your teachers in real time.
                        </p>

                        <div class="controls">
                            <input
                                type="text"
                                id="roomIdInput"
                                placeholder="Enter Class Room ID"
                            >

                            <button id="joinBtn">Join Class</button>
                        </div>
                    </div>
                </div>
            
       

    <div class="meeting-container" id="meetingContainer" style="margin: 0;padding: 0;">
               
        
        <div class="main-display" id="mainArea"  style="display: none;">
            <!-- শিক্ষার্থীর সার্কেল ভিডিও জয়েন করার পর এখানে ভেসে উঠবে -->
            <div class="my-video-card" id="myVideoCard">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="label">You (Student)</div>
            </div>

            <video id="teacherVideo" autoplay playsinline></video>
            
            <button id="raiseHandBtn" class="raise-btn">Raise Hand ✋</button>
            <div id="statusLabel" class="status-muted">🔇 Muted by Teacher</div>

            

            <!-- চ্যাট প্যানেলটি মেইন ডিসপ্লের ভেতরে রাখা হলো যাতে ফুলস্ক্রিনে পারফেক্ট ওভারলে কাজ করে -->
            <div class="chat-panel" id="chatPanel">
                <div class="chat-header">Classroom Chat Board</div>
                <div class="chat-messages" id="chatWindow"></div>
                <div class="chat-input-area">
                    <div class="chat-row">
                        <input type="text" id="msgInput" placeholder="Type a message...">
                        <button id="sendMsgBtn">Send</button>
                    </div>
                    <label class="file-label">
                        📁 Share File / Notes (PDF, Image)
                        <input type="file" id="fileInput" style="display: none;">
                    </label>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let currentFacingMode = 'user';
    let localStream;
    let teacherPc;
    const servers = { iceServers: [{ urls: 'stun:stun1.l.google.com:19302' }] };

    const chatPanel = document.getElementById('chatPanel');
    const mainArea = document.getElementById('mainArea');
    const teacherVideo = document.getElementById('teacherVideo');
    const meetingContainer = document.getElementById('meetingContainer');
    const statusLabel = document.getElementById('statusLabel');
    const myVideoCard = document.getElementById('myVideoCard');
    const raiseHandBtn = document.getElementById('raiseHandBtn');

    let tapTimer = null;
    let hideControlsTimer = null;
    let lastTapTime = 0;
    const TAP_DELAY = 300;

    // Helper function to generate Dummy Video Stream if camera is unavailable
    function createDummyStream() {
        const canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = 480;
        const ctx = canvas.getContext('2d');
        
        let x = 0;
        function draw() {
            ctx.fillStyle = '#1e1e1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff9800';
            ctx.font = '24px Arial';
            ctx.fillText('Student Panel - Dummy Video Active', 50, 100);
            ctx.fillStyle = '#007fff';
            ctx.fillRect(x, 200, 100, 100);
            x = (x + 2) % canvas.width;
            requestAnimationFrame(draw);
        }
        draw();
        return canvas.captureStream(30);
    }

async function toggleFullScreen() {
    const targetElem = document.getElementById('mainArea') || document.getElementById('meetingContainer');

    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        try {
            // 1. Request Fullscreen
            if (targetElem.requestFullscreen) {
                await targetElem.requestFullscreen();
            } else if (targetElem.webkitRequestFullscreen) {
                await targetElem.webkitRequestFullscreen();
            } else if (teacherVideo && teacherVideo.webkitEnterFullscreen) {
                teacherVideo.webkitEnterFullscreen();
            }

            // 2. Lock to Landscape Mode (Mobile devices)
            if (screen.orientation && screen.orientation.lock) {
                await screen.orientation.lock('landscape').catch((err) => {
                    console.warn("Screen orientation lock failed or not supported:", err);
                });
            }
        } catch (err) {
            console.error("Fullscreen request failed:", err);
        }
    } else {
        // Exit Fullscreen
        if (document.exitFullscreen) {
            await document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
            await document.webkitExitFullscreen();
        }

        // Release Orientation Lock
        if (screen.orientation && screen.orientation.unlock) {
            screen.orientation.unlock();
        }
    }
}

    // Show temporary overlay controls
    function showHiddenItems() {
        if (statusLabel) statusLabel.style.display = 'block';
        if (myVideoCard) myVideoCard.style.display = 'block';
        if (raiseHandBtn) raiseHandBtn.style.display = 'inline-block';

        if (hideControlsTimer) clearTimeout(hideControlsTimer);

        hideControlsTimer = setTimeout(() => {
            if (statusLabel) statusLabel.style.display = 'none';
            if (myVideoCard) myVideoCard.style.display = 'none';
            if (raiseHandBtn) raiseHandBtn.style.display = 'none';
        }, 4000);
    }

    // Unified Mobile & Desktop Tap Handling
    function handleTap(e) {
        // Prevent action on interactive UI elements
        if (e.target.closest('button') || 
            e.target.closest('.interactive-btn') || 
            e.target.closest('#chatPanel') || 
            e.target.closest('#myVideoCard')) {
            return;
        }

        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTapTime;

        if (tapLength < TAP_DELAY && tapLength > 0) {
            if (tapTimer) {
                clearTimeout(tapTimer);
                tapTimer = null;
            }
            toggleFullScreen();
        } else {
            tapTimer = setTimeout(() => {
                tapTimer = null;
                showHiddenItems();
            }, TAP_DELAY);
        }
        lastTapTime = currentTime;
    }

    mainArea.addEventListener('touchend', function (e) {
        handleTap(e);
    });

    mainArea.addEventListener('click', function (e) {
        // Run click logic only for non-touch (mouse) devices
        if (!('ontouchstart' in window)) {
            handleTap(e);
        }
    });

    // Join Room
    document.getElementById('joinBtn').onclick = async () => {
        const roomId = document.getElementById('roomIdInput').value;
        if (!roomId) return alert("Please enter Room ID");

        toggleFullScreen();
        document.querySelector(".welcome-container").style.display = "none";
        document.getElementById("mainArea").style.display = "block";

        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        } catch (err) {
            console.warn("Camera/Mic access denied or not found. Falling back to dummy video stream.", err);
            alert("Your camera and microphone is not accessible, a dummy video will play");
            
            localStream = createDummyStream();
            try {
                const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioStream.getAudioTracks().forEach(track => localStream.addTrack(track));
            } catch (e) {
                console.warn("Audio fallback failed, running video-only stream.");
            }
        }

        document.getElementById('localVideo').srcObject = localStream;
        if (localStream.getAudioTracks().length > 0) {
            localStream.getAudioTracks()[0].enabled = false; 
        }

        document.getElementById('raiseHandBtn').style.display = 'block';
        document.getElementById('statusLabel').style.display = 'block';
        document.getElementById('meetingContainer').classList.add('joined');
        
        socket.emit('join-room', { roomId, role: 'student' });

        setTimeout(() => {
            if (statusLabel) statusLabel.style.display = 'none';
            if (myVideoCard) myVideoCard.style.display = 'none';
            if (raiseHandBtn) raiseHandBtn.style.display = 'none';
        }, 8000);
    };

    // Chat Message Handlers
    document.getElementById('sendMsgBtn').onclick = sendTextMessage;
    document.getElementById('msgInput').onkeypress = (e) => { if (e.key === 'Enter') sendTextMessage(); };

    function sendTextMessage() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text) return;

        const name = `Student (${socket.id ? socket.id.substring(0,4) : 'User'})`;
        const data = { sender: name, text: text };
        socket.emit('send-message', data);
        appendMsg(data, 'msg-me');
        input.value = '';
    }

    // File Sharing Handler
    document.getElementById('fileInput').onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 10 * 1024 * 1024) return alert("File size must be under 10MB");

        const reader = new FileReader();
        reader.onload = function(evt) {
            const name = `Student (${socket.id ? socket.id.substring(0,4) : 'User'})`;
            const fileData = {
                sender: name,
                fileName: file.name,
                fileBuffer: evt.target.result
            };
            socket.emit('share-file', fileData);
            appendFile(fileData, 'msg-me');
        };
        reader.readAsDataURL(file);
    };

    function appendMsg(data, className) {
        const win = document.getElementById('chatWindow');
        const div = document.createElement('div');
        div.className = `msg-block ${className}`;
        div.innerHTML = `<strong>${data.sender}:</strong> ${data.text}`;
        win.appendChild(div);
        win.scrollTop = win.scrollHeight;
    }

    function appendFile(data, className) {
        const win = document.getElementById('chatWindow');
        const div = document.createElement('div');
        div.className = `msg-block ${className}`;
        div.innerHTML = `<strong>${data.sender} Shared:</strong> <a class="file-link" href="${data.fileBuffer}" download="${data.fileName}">📁 ${data.fileName}</a>`;
        win.appendChild(div);
        win.scrollTop = win.scrollHeight;
    }

    // Raise Hand Action
    document.getElementById('raiseHandBtn').onclick = function() {
        socket.emit('raise-hand');
        this.innerText = "Hand Raised ✋ (Waiting...)";
        this.disabled = true;
        this.style.background = '#555';
        this.style.color = '#fff';
    };

    // Socket Event Listeners
    socket.on('receive-message', (data) => { appendMsg(data, 'msg-other'); });
    socket.on('receive-file', (data) => { appendFile(data, 'msg-other'); });
    socket.on('all-users', ({ teacherId }) => { if (teacherId) setupTeacherConnection(teacherId); });
    socket.on('teacher-connected', (teacherId) => { setupTeacherConnection(teacherId); });

    socket.on('signal', async (data) => {
        if (data.signal.offer) {
            await teacherPc.setRemoteDescription(new RTCSessionDescription(data.signal.offer));
            const answer = await teacherPc.createAnswer();
            await teacherPc.setLocalDescription(answer);
            socket.emit('signal', { target: data.sender, signal: { answer } });
        } else if (data.signal.candidate) {
            try { await teacherPc.addIceCandidate(new RTCIceCandidate(data.signal.candidate)); } catch(e){}
        }
    });

    socket.on('request-camera-switch', async () => {
        try {
            if (localStream) {
                const oldVideoTrack = localStream.getVideoTracks()[0];
                if (oldVideoTrack) oldVideoTrack.stop();
            }

            currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';

            const newStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: currentFacingMode },
                audio: false 
            });

            const newVideoTrack = newStream.getVideoTracks()[0];
            const localVideoElement = document.getElementById('localVideo');
            if (localVideoElement) {
                localVideoElement.srcObject = newStream;
                localVideoElement.style.transform = (currentFacingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';
            }

            if (teacherPc) {
                const senders = teacherPc.getSenders();
                const videoSender = senders.find(s => s.track && s.track.kind === 'video');
                if (videoSender) {
                    await videoSender.replaceTrack(newVideoTrack);
                }
            }

            if (localStream) {
                const oldTrack = localStream.getVideoTracks()[0];
                if (oldTrack) localStream.removeTrack(oldTrack);
                localStream.addTrack(newVideoTrack);
            }
        } catch (err) {
            console.error("Camera switch error:", err);
            alert("Camera switch failed: " + err.message);
            currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
        }
    });

    socket.on('allowed-to-talk', () => {
        if (localStream && localStream.getAudioTracks().length > 0) {
            localStream.getAudioTracks()[0].enabled = true; 
        }
        document.getElementById('raiseHandBtn').style.display = 'none';
        const statusLabel = document.getElementById('statusLabel');
        statusLabel.innerText = "🎙️ Teacher is listening";
        statusLabel.className = "status-live";
        statusLabel.style.display = 'block';
    });

    socket.on('force-mute', () => {
        if (localStream && localStream.getAudioTracks().length > 0) {
            localStream.getAudioTracks()[0].enabled = false; 
        }
        
        const raiseBtn = document.getElementById('raiseHandBtn');
        raiseBtn.style.display = 'block';
        raiseBtn.innerText = "Raise Hand ✋";
        raiseBtn.disabled = false;
        raiseBtn.style.background = '#ff9800';
        raiseBtn.style.color = 'black';
        
        const statusLabel = document.getElementById('statusLabel');
        statusLabel.innerText = "🔇 Muted by Teacher";
        statusLabel.className = "status-muted";
        statusLabel.style.display = 'block';

        setTimeout(() => {
            statusLabel.style.display = 'none';
            raiseBtn.style.display = 'none';
        }, 3000);
    });

    socket.on('teacher-disconnected', () => {
        document.getElementById('teacherVideo').srcObject = null;
    });

    socket.on('chat-state-changed', (data) => {
        if (data && data.open) {
            chatPanel.classList.add('open');
        } else {
            chatPanel.classList.remove('open');
        }
    });

    function setupTeacherConnection(teacherId) {
        teacherPc = new RTCPeerConnection(servers);
        if (localStream) {
            localStream.getTracks().forEach(track => teacherPc.addTrack(track, localStream));
        }
        teacherPc.ontrack = (event) => { 
            document.getElementById('teacherVideo').srcObject = event.streams[0]; 
        };
        teacherPc.onicecandidate = (event) => {
            if (event.candidate) socket.emit('signal', { target: teacherId, signal: { candidate: event.candidate } });
        };
    }

    // Auto-Join from URL parameter
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const roomIdFromUrl = urlParams.get('room');
        if (roomIdFromUrl) {
            document.getElementById('roomIdInput').value = roomIdFromUrl;
            setTimeout(() => {
                document.getElementById('joinBtn').click();
            }, 500);
        }
    });
</script>
</body>
</html>
